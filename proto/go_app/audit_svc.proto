edition = "2023";
package go_app;

import "go_app/audit.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";

option go_package = "github.com/lesomnus/go-app";

service AuditService {
  // Add creates a new Audit
  rpc Add(AuditAddRequest) returns (Audit);
  // Get retrieves a Audit
  rpc Get(AuditGetRequest) returns (Audit);
  // Patch updates an existing Audit
  rpc Patch(AuditPatchRequest) returns (Audit);
  // Apply applies a patch document to an existing Audit
  rpc Apply(AuditApplyRequest) returns (Audit);
  // Erase deletes a Audit
  rpc Erase(AuditRef) returns (google.protobuf.Empty);
  // List the trail of what happened, newest first.
  rpc List(AuditListRequest) returns (AuditListResponse);
  // Watch the trail as it is written.
  //
  // It answers with rows and not with the wrapper the other watches use, and
  // **it sends no first message**. Both are the same fact about a trail: it is
  // a log rather than a set of things that have a current state. There is
  // nothing to converge on -- a row is written once and never changes and is
  // never erased -- so there is no state to be told and no removal to say by
  // absence. What happened before the stream opened is what `List` is for.
  rpc Watch(AuditWatchRequest) returns (stream AuditWatchResponse);
}

message AuditAddRequest {
  bytes id = 1;
  bytes tenant_id = 2 [features.field_presence = IMPLICIT];
  bytes actor_id = 3 [features.field_presence = IMPLICIT];
  bytes trace_id = 4 [features.field_presence = IMPLICIT];
  string action = 5 [features.field_presence = IMPLICIT];
  bytes object_id = 6 [features.field_presence = IMPLICIT];
  bytes patch = 7 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message AuditGetRequest {
  AuditRef ref = 1;
  AuditSelect select = 2;
}

message AuditRef {
  oneof key {
    bytes id = 1;
  }
}

message AuditSelect {
  bool all = 1;
  bool tenant_id = 2;
  bool actor_id = 3;
  bool trace_id = 4;
  bool action = 5;
  bool object_id = 6;
  bool patch = 7;
  bool date_created = 15;
}

message AuditPatchRequest {
  AuditRef ref = 1;
  bytes tenant_id = 4;
  bytes actor_id = 6;
  bytes trace_id = 8;
  string action = 10;
  bytes object_id = 12;
  bytes patch = 14;
}

message AuditApplyRequest {
  AuditRef ref = 1;
  patch.Patch patch = 2;
}

message AuditListRequest {
  // Bounded because the work is: each one is a predicate in the same query, and
  // a request may carry as many as it likes. The bound is in `audit.List`,
  // where a reader of it can see what it costs.
  repeated AuditFilter filters = 1;

  // Whose trail it is, which narrows the answer before it is cut short rather
  // than after. A wall that removed rows from what came back would be a wall
  // that any Tenant could push another one's trail out of, just by writing
  // enough of its own; see `audit.PageLimit`.
  //
  // A filter and not the wall. The wall is `gate.Wall()`, in the query of every
  // read there is; this is how whoever may see more than one Tenant asks about
  // one of them.
  bytes tenant_id = 2;

  // How many to answer with, and where to carry on from; see
  // `HolderListRequest`. A trail is the list most likely to outgrow one answer,
  // and it is read newest first, so a cursor is what reading further back
  // means.
  int32 size = 3;
  string after = 4;
}

message AuditListResponse {
  repeated Audit items = 1;

  // What to ask for next, and empty when this was the last of them.
  string next = 2;
}

// AuditFilter names what a caller is asking the history of.
message AuditFilter {
  bytes object_id = 1;
}

message AuditWatchRequest {
  // Which rows to watch, in the same words `List` takes them.
  repeated AuditFilter filters = 1;

  // Whose trail it is; see `AuditListRequest.tenant_id`. Zero bytes is every
  // Tenant this caller may see.
  bytes tenant_id = 2;
}

message AuditWatchResponse {
  repeated Audit items = 1;
}
