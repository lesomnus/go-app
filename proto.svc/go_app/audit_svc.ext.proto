edition = "2023";

service AuditService {
  // List the trail of what happened, newest first.
  rpc List(AuditListRequest) returns (AuditListResponse);
}

// AuditFilter names what a caller is asking the history of.
message AuditFilter {
  bytes object_id = 1;
}

message AuditListRequest {
  // Bounded because the work is: each one is a predicate in the same query, and
  // a request may carry as many as it likes. The bound is in `audit.List`,
  // where a reader of it can see what it costs.
  repeated AuditFilter filters = 1;

  // Whose trail it is, which narrows the answer before it is cut short rather
  // than after. A wall that removed rows from what came back would be a wall
  // that any Tenant could push another one's trail out of, just by writing
  // enough of its own; see `audit.PageLimit`.
  //
  // A filter and not the wall. The wall is `gate.Wall()`, in the query of every
  // read there is; this is how whoever may see more than one Tenant asks about
  // one of them.
  bytes tenant_id = 2;

  // How many to answer with, and where to carry on from; see
  // `HolderListRequest`. A trail is the list most likely to outgrow one answer,
  // and it is read newest first, so a cursor is what reading further back
  // means.
  int32 size = 3;
  string after = 4;
}
message AuditListResponse {
  repeated Audit items = 1;

  // What to ask for next, and empty when this was the last of them.
  string next = 2;
}
