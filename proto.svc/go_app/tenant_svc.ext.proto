edition = "2023";

service TenantService {
  // List the Tenants a caller may see, which for most of them is one.
  //
  // It is worth having anyway, and the reason is [gate.Policy]: a deployment
  // that injects one may answer with several, and without this there is no way
  // to ask which. It is also what `Watch` reads its first message from.
  rpc List(TenantListRequest) returns (TenantListResponse);

  // Watch the Tenants a caller may see, as they are now and as they change.
  // See `HolderService.Watch`, which this is in every way.
  rpc Watch(TenantWatchRequest) returns (stream TenantWatchResponse);
}

message TenantFilter {
  TenantRef ref = 1;
}

message TenantListRequest {
  // Bounded because the work is; see `AuditListRequest.filters`.
  repeated TenantFilter filters = 1;

  // How many to answer with, and where to carry on from; see
  // `HolderListRequest`.
  int32 size = 2;
  string after = 3;
}
message TenantListResponse {
  repeated Tenant items = 1;

  // What to ask for next, and empty when this was the last of them.
  string next = 2;
}

message TenantWatchRequest {
  // Which Tenants to watch, in the same words `List` takes them.
  repeated TenantFilter filters = 1;
}
message TenantWatchResponse {
  repeated TenantWatchItem items = 1;
}

message TenantWatchItem {
  // Which Tenant. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The Tenant as it is now, and absent when it is no longer one this caller
  // may see. See `HolderWatchItem.value`, including why nothing distinguishes
  // "erased" from "no longer yours".
  //
  // A Tenant is erased for real rather than softly, so absence here is the only
  // thing there could ever have been to say about one that is gone.
  Tenant value = 2;

  // The RPC that changed it. See `HolderWatchItem.action`.
  string action = 3;
}
