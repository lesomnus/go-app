# The gRPC server (used by the `serve` subcommand).
server:
  addr: ":50051"
  # Left to gRPC when it is not said: 4 MiB in, no limit out, its own stream
  # limit. Sizes are bytes.
  # max_recv_msg_size: 4194304
  # max_send_msg_size: 0
  # max_concurrent_streams: 0
  #
  # How long a call that arrived without a deadline of its own is given. One
  # that named a deadline is left alone, however far away it is. Streams are
  # never capped. Nothing written down is 30s; a *negative* one caps nothing,
  # which reads oddly because letting a call run forever is a thing to mean.
  # timeout: 30s
  #
  # Serves the reflection service, which is what lets grpcurl ask the server
  # what it offers -- handy, and a listing of every RPC there is. Written down
  # here so that the template is pleasant to run; what is unwritten is off,
  # everywhere in this file.
  allow_reflection: true
  #
  # Lets a caller who said nothing about who they are make the reads this app
  # generates -- Get, List and Watch -- and nothing else. It is a list of what
  # is *allowed*: an RPC written by hand is closed until somebody opens it,
  # which is the right way round, since `Rename` is a write and is not called
  # `Patch`. A caller who says who they are is not affected either way.
  # allow_anonymous_reads: true
  #
  # Serves `Patch` and `Apply`, the two RPCs every generated service has that
  # can write anything the schema holds. It should stay off: they are how the
  # servers write, not how a caller asks. An app that wants a caller to be able
  # to change something writes the RPC that means it and implements it with one
  # of these. See the README, "The general write is not an API".
  # allow_general_writes: true
  #
  # How often one caller may call, counted against whoever they are -- and
  # every anonymous caller against one bucket between them, since an anonymous
  # caller has nothing to be told apart by. Off unless a rate is written down,
  # and off is what this file says: a number picked by a template is a number
  # nobody measured, and what it would refuse is real traffic on the day the
  # app is busiest.
  #
  # It is counted in this process. Three replicas are three buckets, so a rate
  # of 20 is 60 to whoever a load balancer spreads around. That is fine for
  # keeping one caller from taking a whole process and wrong for a quota
  # somebody is billed against; see the README, "How much one caller may ask
  # for".
  # limit:
  #   # Calls a second, kept up.
  #   rate: 20
  #   # How many may arrive at once. Unset is one second's worth. This is the
  #   # number that decides whether an honest client is refused: one that sends
  #   # its work in batches is bursty by construction.
  #   burst: 40

  # The second listener: what this app serves to something that cannot speak
  # gRPC. It is a port of its own rather than the same one, because gRPC served
  # through Go's HTTP server gives up the transport gRPC brings -- so the fast
  # path keeps its own listener and browsers come here. Nothing is served at
  # all unless an address is written down.
  # http:
  #   addr: ":8080"
  #   # Translate grpc-web into the gRPC server, so a browser reaches the same
  #   # handlers, the same interceptors and the same wall as anything else.
  #   allow_grpc_web: true
  #   # Where a browser may call from. Nothing written down is nowhere, so a
  #   # page nobody named is refused rather than served. `["*"]` is every page
  #   # on the internet, which is a thing to mean rather than to reach for --
  #   # and it is not the wall and not authentication either way.
  #   origins: ["http://localhost:5173"]   # what `ui` runs on in development
  #   # The heap, the goroutines, and the ability to make the process spend
  #   # thirty seconds profiling itself. Keep it off anywhere a stranger can
  #   # reach.
  #   allow_pprof: false
  #
  # `/healthz` and `/healthz/liveness` are served whenever this listener is,
  # out of the same health server the gRPC ones answer from -- so the two can
  # never disagree. See the README, "Which health question is being asked".

  # keepalive:
  #   # Behind a load balancer that only balances new connections, this is what
  #   # makes it balance anything at all.
  #   max_connection_age: 30m
  #   max_connection_age_grace: 30s
  #   # Hang up on a client that pings more often than this. Keep it below what
  #   # the clients are configured with.
  #   min_time: 10s

# How a caller says who it is (used by the `serve` subcommand).
auth:
  # The ways a caller may say, tried in the order they are written. The first
  # one that finds a credential answers; one that finds a bad credential, or
  # cannot tell whether it is good, refuses the call rather than letting the
  # next one have a go -- so a token that has expired does not quietly become
  # whoever the certificate says.
  #
  #   plain    believe what the caller writes:
  #              authorization: Plain <subject>
  #            Nothing is checked, so this is for development and for a server
  #            nobody untrusted can reach. It is said out loud at startup.
  #
  #   mtls     read the name out of the client certificate: a URI SAN, or the
  #            common name. Nothing is checked here either, and here that is
  #            right -- the handshake already did it. Needs
  #            server.tls.client_ca_file, and server.tls.client_cert_optional
  #            if callers who have no certificate are to get as far as another
  #            method.
  #
  #   bearer   exchange an opaque token for a name:
  #              authorization: Bearer <token>
  #            The only one that has to ask something, which is why it is the
  #            only one that can answer Unavailable.
  #
  # Nothing here at all means every caller is anonymous, which is a caller like
  # any other -- what one may do is `server.allow_anonymous_reads`, above.
  methods: [plain]
  # methods: [bearer, mtls]

  # The sample token store, and a sample is all it is: these are secrets, and a
  # secret in a configuration file is a secret in a backup and in a terminal
  # history. A real one is an issuer -- a JWT this app verifies, an
  # introspection endpoint, a table somebody else owns -- and `auth.TokenStore`
  # is where one is injected. See server/auth/token.go.
  # bearer:
  #   ttl: 24h
  #   subjects:
  #     # The subject is opaque: whatever the issuer calls somebody. Nothing in
  #     # this app reads it.
  #     anna:
  #       token: "a-secret-nobody-else-knows"
  #
  #     # A token may allow less than its subject may, and never more. Say
  #     # nothing and it allows whatever they do.
  #     ci:
  #       token: "a-different-secret"
  #       actions:
  #         - /go_app.CoffeeService/Get
  #         - /go_app.CoffeeService/List

# Database used by the gRPC services (used by the `serve` subcommand).
db:
  # Registered drivers are "sqlite3" (SQLite on Wasm) and "pgx" (PostgreSQL);
  # see cmd/config/db-*.go to add another one.
  #
  # What this file names is SQLite **in memory**: it needs nothing around it,
  # and it leaves nothing behind. `go run . serve` and there is an app. Every
  # connection naming the same file gets the same database, and the whole thing
  # goes when the process does -- so it is a demonstration and not a place to
  # keep anything.
  driver: sqlite3
  dsn: "file:/go-app.db?vfs=memdb&_pragma=foreign_keys(1)"

  # One, because SQLite takes one writer: a second connection asking to write
  # reports a busy database rather than waiting for the first.
  max_open_conns: 1

  # A file instead, which survives a restart.
  # dsn: "file:go-app.db?_pragma=foreign_keys(1)"

  # Production runs on PostgreSQL, since that is what the migrations are
  # written for; `docker compose up -d db` brings one up.
  # driver: pgx
  # dsn: "postgres://postgres:postgres@localhost:5432/go-app?sslmode=disable"
  # max_open_conns: 0
  # The dev database `migrate plan` works the migrations out on. It is emptied
  # every time it is used, so nothing may live in it.
  # dev_dsn: "postgres://postgres:postgres@localhost:5432/dev?sslmode=disable"

  # Run ent auto migration on startup. It is for development only; production
  # runs `migrate apply`, which is versioned and reviewed -- and an in-memory
  # database has nowhere to have applied them, so this is what puts the schema
  # there at all.
  migrate: true

# Greeting configuration (used by the `greet` subcommand).
greet:
  # Format string; %s is replaced with the name argument.
  format: "Hello, %s!"
