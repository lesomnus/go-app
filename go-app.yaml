# The gRPC server (used by the `serve` subcommand).
server:
  addr: ":50051"
  # Left to gRPC when it is not said: 4 MiB in, no limit out, its own stream
  # limit. Sizes are bytes.
  # max_recv_msg_size: 4194304
  # max_send_msg_size: 0
  # max_concurrent_streams: 0
  #
  # Serves the reflection service, which is what lets grpcurl ask the server
  # what it offers. On unless it is turned off.
  # reflection: true
  #
  # keepalive:
  #   # Behind a load balancer that only balances new connections, this is what
  #   # makes it balance anything at all.
  #   max_connection_age: 30m
  #   max_connection_age_grace: 30s
  #   # Hang up on a client that pings more often than this. Keep it below what
  #   # the clients are configured with.
  #   min_time: 10s

# Database used by the gRPC services (used by the `serve` subcommand).
db:
  # Registered drivers are "sqlite3" (SQLite on Wasm) and "pgx" (PostgreSQL);
  # see cmd/config/db-*.go to add another one.
  #
  # SQLite needs nothing around it, which is why it is what this file names.
  # Production runs on PostgreSQL, since that is what the migrations are
  # written for; `docker compose up -d db` brings one up.
  driver: sqlite3
  dsn: "file:go-app.db?_pragma=foreign_keys(1)"
  # driver: pgx
  # dsn: "postgres://postgres:postgres@localhost:5432/go-app?sslmode=disable"
  # The dev database `migrate plan` works the migrations out on. It is emptied
  # every time it is used, so nothing may live in it.
  # dev_dsn: "postgres://postgres:postgres@localhost:5432/dev?sslmode=disable"

  # Run ent auto migration on startup. It is for development only; production
  # runs `migrate apply`, which is versioned and reviewed.
  migrate: true

# Greeting configuration (used by the `greet` subcommand).
greet:
  # Format string; %s is replaced with the name argument.
  format: "Hello, %s!"
