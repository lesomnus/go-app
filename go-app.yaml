# The gRPC server (used by the `serve` subcommand).
server:
  addr: ":50051"
  # Left to gRPC when it is not said: 4 MiB in, no limit out, its own stream
  # limit. Sizes are bytes.
  # max_recv_msg_size: 4194304
  # max_send_msg_size: 0
  # max_concurrent_streams: 0
  #
  # How long a call that arrived without a deadline of its own is given. One
  # that named a deadline is left alone, however far away it is. Streams are
  # never capped. Unset is 30s; `0` written down caps nothing.
  # timeout: 30s
  #
  # Serves the reflection service, which is what lets grpcurl ask the server
  # what it offers. On unless it is turned off.
  # reflection: true
  #
  # keepalive:
  #   # Behind a load balancer that only balances new connections, this is what
  #   # makes it balance anything at all.
  #   max_connection_age: 30m
  #   max_connection_age_grace: 30s
  #   # Hang up on a client that pings more often than this. Keep it below what
  #   # the clients are configured with.
  #   min_time: 10s

# How a caller says who it is (used by the `serve` subcommand).
auth:
  # The ways a caller may say, tried in the order they are written. The first
  # one that finds a credential answers; one that finds a bad credential, or
  # cannot tell whether it is good, refuses the call rather than letting the
  # next one have a go -- so a token that has expired does not quietly become
  # whoever the certificate says.
  #
  #   plain    believe what the caller writes:
  #              authorization: Plain <tenant-alias>/<holder-alias>
  #            Nothing is checked, so this is for development and for a server
  #            nobody untrusted can reach. It is said out loud at startup.
  #
  #   mtls     read the name out of the client certificate: a URI SAN, or the
  #            common name. Nothing is checked here either, and here that is
  #            right -- the handshake already did it. Needs
  #            server.tls.client_ca_file, and server.tls.client_cert_optional
  #            if callers who have no certificate are to get as far as another
  #            method.
  #
  #   bearer   exchange an opaque token for a name:
  #              authorization: Bearer <token>
  #            The only one that has to ask something, which is why it is the
  #            only one that can answer Unavailable.
  #
  # Nothing here at all serves only what is public.
  methods: [plain]
  # methods: [bearer, mtls]

  # The sample token store, and a sample is all it is: these are secrets, and a
  # secret in a configuration file is a secret in a backup and in a terminal
  # history. A real one is a table or an issuer. See server/auth/token.go.
  # bearer:
  #   ttl: 24h
  #   holders:
  #     acme/admin: "a-secret-nobody-else-knows"

# Database used by the gRPC services (used by the `serve` subcommand).
db:
  # Registered drivers are "sqlite3" (SQLite on Wasm) and "pgx" (PostgreSQL);
  # see cmd/config/db-*.go to add another one.
  #
  # SQLite needs nothing around it, which is why it is what this file names.
  # Production runs on PostgreSQL, since that is what the migrations are
  # written for; `docker compose up -d db` brings one up.
  driver: sqlite3
  dsn: "file:go-app.db?_pragma=foreign_keys(1)"
  # driver: pgx
  # dsn: "postgres://postgres:postgres@localhost:5432/go-app?sslmode=disable"
  # The dev database `migrate plan` works the migrations out on. It is emptied
  # every time it is used, so nothing may live in it.
  # dev_dsn: "postgres://postgres:postgres@localhost:5432/dev?sslmode=disable"

  # Run ent auto migration on startup. It is for development only; production
  # runs `migrate apply`, which is versioned and reviewed.
  migrate: true

# Greeting configuration (used by the `greet` subcommand).
greet:
  # Format string; %s is replaced with the name argument.
  format: "Hello, %s!"
