name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # This repository keeps a branch per kind of app, and they are worth
      # checking too. An app made from one of them has no such branches and
      # can drop this line.
      - kind/**
    paths: &paths
      - .github/workflows/ci.yaml
      - buf.gen.svc.yaml
      - buf.gen.yaml
      - buf.lock
      - buf.yaml
      - cmd/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - go_app/**
      - internal/**
      - main.go
      - migrations/**
      - proto/**
      - proto.svc/**
      - scripts/**
      - server/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

jobs:
  # Everything here answers one question: is what is committed still what the
  # sources say it should be? The entities are declared once, in proto/, and
  # the Go code, the ent runtime and the migrations are all derived from them.
  # A change to the declaration that stops there is what this catches.
  check:
    runs-on: ubuntu-latest

    services:
      # The dev database the migrations are planned against. It is emptied by
      # the planning, so it holds nothing to begin with.
      dev:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"
          github_token: ${{ github.token }}

      - name: Lint the protobuf definitions
        run: buf lint

      - name: Generated code is what the definitions say
        run: |
          buf generate --template buf.gen.svc.yaml
          ./scripts/gen-service.sh
          ./scripts/gen-go.sh
          ./scripts/gen-ent.sh
          git diff --exit-code

      - name: Migrations are what the schema says
        run: |
          go run . migrate plan \
            --dev "postgres://postgres:postgres@localhost:5432/dev?sslmode=disable" \
            ci
          # Planning writes a file only if the schema moved without one.
          test -z "$(git status --porcelain migrations/)" \
            || { git status --short migrations/; exit 1; }

  build:
    runs-on: ubuntu-latest
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/bake-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64
            app.platform=linux/arm64
            app.output=type=registry
