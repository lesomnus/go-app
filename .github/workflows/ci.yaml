name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # This repository keeps a branch per kind of app, and they are worth
      # checking too. An app made from one of them has no such branches and
      # can drop this line.
      - kind/**
    # One list for every job, since `proto/` is what both halves are made
    # from: a change to an entity is a change to the Go and to the TypeScript
    # at once, and a filter per job would have to say so twice.
    paths: &paths
      - .github/workflows/ci.yaml
      - buf.gen.svc.yaml
      - buf.gen.ui.yaml
      - buf.gen.yaml
      - buf.lock
      - buf.yaml
      - cmd/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
      - go_app/**
      - internal/**
      - main.go
      - migrations/**
      - proto/**
      - proto.svc/**
      - scripts/**
      - server/**
      - ui/**
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

jobs:
  # Everything here answers one question: is what is committed still what the
  # sources say it should be? The entities are declared once, in proto/, and
  # the Go code, the ent runtime and the migrations are all derived from them.
  # A change to the declaration that stops there is what this catches.
  check:
    runs-on: ubuntu-latest

    services:
      # The dev database the migrations are planned against. It is emptied by
      # the planning, so it holds nothing to begin with.
      dev:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history, since the step below reads the commit this push
          # moved from.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"
          github_token: ${{ github.token }}

      - name: Lint the protobuf definitions
        run: buf lint

      # The definitions are what everything else is made from, and the step
      # below checks that the generated code still matches them. Nothing
      # checked that the definitions themselves stayed compatible, which is
      # the one change no amount of regenerating catches.
      - name: The definitions did not break
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # What to compare against: the branch a pull request is aimed at, or
          # the commit this push moved from.
          #
          # An app made from this template compares against its default branch
          # and nothing else -- `buf breaking --against '.git#branch=main'`.
          # This repository cannot: it keeps a branch per kind of app, and
          # `main` carries no definitions at all, so comparing against it
          # would be comparing against nothing.
          if [ -n "${BASE_REF}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            against="$(git rev-parse FETCH_HEAD)"
          elif git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            against="${BEFORE}"
          else
            # A branch that is new to the remote, or a run started by hand.
            echo "there is nothing behind this to compare against"
            exit 0
          fi

          echo "against ${against}"
          buf breaking --against ".git#ref=${against}"

      - name: Generated code is what the definitions say
        run: |
          buf generate --template buf.gen.svc.yaml
          ./scripts/gen-service.sh
          ./scripts/gen-go.sh
          ./scripts/gen-ent.sh
          git diff --exit-code

      - name: Migrations are what the schema says
        run: |
          go run . migrate plan \
            --dev "postgres://postgres:postgres@localhost:5432/dev?sslmode=disable" \
            ci
          # Planning writes a file only if the schema moved without one.
          test -z "$(git status --porcelain migrations/)" \
            || { git status --short migrations/; exit 1; }

  # The same question as `check`, asked of the other half of the contract. The
  # protos are generated into `ui/src/gen` too, and nothing in the Go job can
  # tell that a change to an entity stopped there -- a page built against
  # yesterday's messages compiles perfectly well.
  #
  # An app that deletes `ui/` deletes this job with it.
  ui:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          # `ui/.nvmrc`, so the version is said once and `nvm use` reads the
          # same thing -- the way `check` reads Go's out of `go.mod`.
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"
          github_token: ${{ github.token }}

      # `ci` and not `install`: it installs what the lock file says and fails
      # if the lock file and the manifest disagree, which is the check worth
      # having here.
      - name: Install
        run: npm ci

      - name: Generated TypeScript is what the definitions say
        working-directory: .
        run: |
          ./scripts/gen-ui.sh
          git diff --exit-code

      # After generating, so that the type checking is done against the
      # messages the protos say rather than against the committed ones.
      - name: Build
        run: npm run build

  build:
    runs-on: ubuntu-latest
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: test,build
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/bake-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          source: .
          targets: app
          set: |
            app.platform=linux/amd64
            app.platform=linux/arm64
            app.output=type=registry
